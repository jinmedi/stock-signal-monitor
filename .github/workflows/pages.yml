name: Deploy dashboard

on:
  workflow_run:
    workflows: ["Daily signal check"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "site/**"
      - "stock_signal_monitor/**"
      - "config.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      refresh_news:
        description: "뉴스 캐시를 무시하고 감성을 다시 분류"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Build dashboard data
        env:
          # Reuses state/news.json from the monitor run when it is fresh; otherwise classifies once.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # The dashboard's "지금 갱신" button dispatches this workflow with refresh_news=true.
        run: python -m stock_signal_monitor.report --out site/data.json ${{ inputs.refresh_news == true && '--refresh-news' || '' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
