name: Daily signal check

on:
  schedule:
    # 22:00 UTC Mon–Fri = 07:00 KST, ~1–2h after the US close (yfinance has the final bar by then)
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
    inputs:
      resend:
        description: "현재 상황을 Telegram으로 다시 보냄 (같은 봉 중복 방지 무시)"
        type: boolean
        default: false
      refresh_news:
        description: "뉴스 캐시를 무시하고 감성을 다시 분류"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Run monitor and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional: news sentiment via Claude. Without it the run works, just without 뉴스 감성.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Scheduled: dedup state + quiet when nothing new. Dispatched with resend=true (dashboard
        # "지금 갱신" → "Telegram도 받기"): ignore dedup so the current picture is sent again.
        run: >-
          python -m stock_signal_monitor --telegram
          ${{ inputs.resend == true && '--no-state' || '--quiet-when-empty' }}
          ${{ inputs.refresh_news == true && '--refresh-news' || '' }}

      - name: Persist state (dedup, earnings cache, news cache, hit-rate tracking)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/  # whichever of last_signals.json, events.json, news.json, track.csv exist
          git diff --cached --quiet || git commit -m "chore: update signal state [skip ci]"
          git push
