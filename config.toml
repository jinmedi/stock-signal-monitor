# 감시할 종목 (Yahoo Finance 티커)
tickers = [
  "SOXL", "BMNR", "VOO", "NVDA", "TSLA", "GLD", "AMZN", "AAPL",
  "JEPQ", "PLTR", "IREN", "SPCX", "GOOG", "FRMI",   # 보유 종목 (BMNR 비트마인, IREN 아이렌, SPCX 스페이스X, FRMI 퍼미)
  "INTC", "TSM",                                     # 반도체 참고 종목
]

# 가격 데이터 조회 기간 (장기 20-12-12 계산에 최소 45봉 필요)
history_period = "1y"

# 스토캐스틱 슬로우 파라미터 (N, M, T) = (기간, %K 평활, %D 평활)
[stochastic.short]
n = 5
m = 3
t = 3

[stochastic.mid]
n = 10
m = 6
t = 6

[stochastic.long]
n = 20
m = 12
t = 12

[thresholds]
oversold = 20
overbought = 80

[alerts]
# 단기 교차만으로도 매수/매도 신호를 보낼지, 아니면 중기 방향이 같을 때만 보낼지
require_mid_confirmation = false
# 중기·장기 교차도 별도 알림으로 보낼지
notify_mid_long_crosses = true

[events]
# 실적 발표 D-n 이내(당일 포함)에 나온 단기 교차는 "실적 발표 D-n, 보류"로 HOLD 처리. 0 이면 끔.
# 실적일은 yfinance 에서 받아 state/events.json 에 캐시(7일)하고, 실패하면 필터를 건너뜀.
earnings_blackout_days = 3

[news]
# 뉴스 수집(yfinance 종목 뉴스 + Google News RSS)과 Claude 감성 분류. ANTHROPIC_API_KEY 가 없으면 감성 없이 동작.
enabled = true
# 0: 감성은 참고 정보로만 표시. 1: BUY 에 감성 ≥ 0 이면 ★+1, ≤ -1 이면 ★-1 (SELL 은 반대).
weight = 0
# 별점 최대 개수 (weight 를 켜면 5개까지 늘어남)
max_stars = 5
# 최근 몇 시간의 헤드라인을 모을지
hours = 72
# 업종 검색어 (한글이면 한국어 Google News 를 조회)
queries = ["semiconductor stocks", "반도체 주식"]
model = "claude-opus-5-5"
# 분류 결과 캐시 시간: 알림 실행 직후의 대시보드 빌드가 같은 결과를 재사용하되, 다음 날 아침 실행(22:00 UTC)은
# 반드시 새로 분류하도록 12시간보다 짧게 둠. 종목 목록이 바뀌면 시간과 무관하게 다시 분류함.
cache_hours = 6
# |감성| 이 이 값 이상이면 교차가 없어도 "⚠ 주의" 항목으로 알림
caution_threshold = 2
